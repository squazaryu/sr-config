name: Validate Shadowrocket configs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test stable AI routing
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate configs
        run: python3 tools/validate_configs.py
      - name: Check remote RULE-SET sources
        run: python3 tools/check_remote_sources.py
      - name: Verify failsafe snapshots
        run: python3 tools/build_failsafe.py --check
